<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Anaga Audioguide</title>

  <!-- PWA -->
  <link rel="manifest"
        href="./manifest.json">

  <meta name="theme-color"
        content="#121212">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">

  <meta name="apple-mobile-web-app-title"
        content="Anaga Audio">

  <link rel="apple-touch-icon"
        href="./icon-192.png">

  <!-- STYLES -->
  <link rel="stylesheet"
        href="./style.css">

  <!-- LEAFLET LOCAL -->
  <link rel="stylesheet"
        href="./leaflet.css">

  <script src="./leaflet.js"></script>

</head>

<body>

  <!-- HEADER -->
  <header>

    <h1 id="guide-title">
      Anaga
    </h1>

    <p class="subtitle"
       id="guide-description">
      The Pirate Coast
    </p>

  </header>

  <!-- HERO -->
  <section class="hero">

    <img src="./hero.jpg"
         alt="Anaga landscape">

  </section>

  <!-- MAP -->
  <div id="map"></div>

  <!-- ROUTE -->
  <div class="info-block">

    📍

    <a href="https://www.google.com/maps/dir/28.485858,-16.313423/28.535007,-16.268433/28.533007,-16.263997/28.549166,-16.206877/28.558258,-16.205677/28.560470,-16.217270/28.571198,-16.204568/28.572064,-16.192508/28.480816,-16.240959"
       target="_blank">

      Google Maps route available

    </a>

    <span>
      (internet required)
    </span>

  </div>

  <!-- GUIDE INFO -->
  <div class="info-block">

    📄

    <a href="./EN-ANAGA.html"
       target="_blank">

      Opening hours and practical tips

    </a>

  </div>

  <!-- DOWNLOAD -->
  <button id="download-btn">

    Download offline content

  </button>

  <div id="download-status"></div>

  <!-- AUDIO LIST -->
  <ul id="audio-list"
      class="track-list">

    <!-- GENERATED BY app.js -->

  </ul>

  <!-- IOS -->
  <div id="ios-msg"
       style="display:none;">

    ➕ Add to Home Screen to use offline on iPhone

  </div>

  <!-- AUDIO PLAYER -->
  <audio id="audio-player"
         controls
         controlsList="nodownload">

  </audio>

  <!-- APP -->
  <script src="./app.js"></script>

</body>

</html>
