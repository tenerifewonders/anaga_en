<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioguía</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- Leaflet (MAPA) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

  <header>
    <h1 id="guide-title">Audio Guide</h1>
    <p id="guide-description" class="subtitle"></p>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- Lista generada desde ANAGA.geojson -->
  <div id="lista"></div>

  <br><br>
  <span style="margin-right:6px;">➡️</span>
  <a href="./EN-ANAGA.pdf" target="_blank">ANAGA - THE PIRATE COAST.PDF</a>
  <br><br>

  <div class="hero" id="hero"></div>

  <section id="tracks" class="track-list"></section>

  <!-- Reproductor -->
  <script src="./app.js"></script>

  <!-- Script que carga el GeoJSON y genera la lista -->
  <script>
  async function cargarPuntos() {
    const res = await fetch('./ANAGA.geojson');
    const data = await res.json();
    return data.features.map(f => ({
      nombre: f.properties.Name,
      lat: f.geometry.coordinates[1],
      lng: f.geometry.coordinates[0]
    }));
  }

  async function generarLista() {
    const puntos = await cargarPuntos();
    const cont = document.getElementById("lista");

    puntos.forEach((p, i) => {
      const item = document.createElement("div");
      item.className = "capitulo";
      item.innerText = p.nombre;
      item.onclick = () => seleccionarCapitulo(i);
      cont.appendChild(item);
    });
  }

  generarLista();
  </script>

  <!-- MAPA: carga GeoJSON y muestra puntos -->
  <script>
  async function initMap() {
    // Crear mapa centrado en Anaga
    const map = L.map('map').setView([28.53, -16.25], 12);

    // Capa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    // Cargar tus puntos
    const res = await fetch('./ANAGA.geojson');
    const data = await res.json();

    L.geoJSON(data, {
      onEachFeature: (feature, layer) => {
        layer.bindPopup(feature.properties.Name);
      }
    }).addTo(map);
  }

  initMap();
  </script>

</body>
</html>
