<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioguía Anaga</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 50vh; width: 100%; }
    #audio-list { padding: 15px; list-style: none; margin: 0; }
    #audio-list li { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; }
    #audio-player { width: 100%; position: fixed; bottom: 0; left: 0; }
  </style>
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- LISTA DE AUDIOS -->
  <ul id="audio-list"></ul>

  <!-- PLAYER -->
  <audio id="audio-player" controls></audio>

  <script>
    // Inicializar mapa
    const map = L.map('map').setView([28.525, -16.25], 13);

    // Tiles locales
    L.tileLayer('./tiles/{z}/{x}/{y}.png', {
      minZoom: 11,
      maxZoom: 14,
      tileSize: 256
    }).addTo(map);

    // Cargar GeoJSON
    fetch('./ANAGA.geojson')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("audio-list");
        const player = document.getElementById("audio-player");

        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            const name = feature.properties.Name;
            const audioUrl = feature.properties.audio;

            // Añadir a la lista
            const li = document.createElement("li");
            li.textContent = name;
            li.onclick = () => {
              player.src = audioUrl;
              player.play();
              map.setView(layer.getLatLng(), 15);
              layer.openPopup();
            };
            list.appendChild(li);

            // Popup en el mapa
            layer.bindPopup(name);

            // Click en el mapa reproduce audio
            layer.on("click", () => {
              player.src = audioUrl;
              player.play();
            });
          }
        }).addTo(map);
      });

    // Geolocalización
    map.locate({ setView: false });

    map.on('locationfound', e => {
      L.circleMarker(e.latlng, {
        radius: 8,
        color: "#007bff",
        fillColor: "#3fa0ff",
        fillOpacity: 0.8
      }).addTo(map);
    });
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
