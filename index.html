<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anaga Audioguía</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Estilos básicos -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    #player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="player">
  <audio id="audio" controls style="width:100%"></audio>
</div>

<script>
  // Inicializar mapa
  const map = L.map('map').setView([28.525, -16.25], 13);

  // Tiles locales (offline)
  L.tileLayer('./tiles/{z}/{x}/{y}.png', {
    minZoom: 11,
    maxZoom: 14,
    tileSize: 256
  }).addTo(map);

  // Cargar puntos desde GeoJSON local
  fetch('./ANAGA.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        onEachFeature: (feature, layer) => {
          if (feature.properties && feature.properties.audio) {
            layer.on('click', () => {
              const audio = document.getElementById("audio");
              audio.src = feature.properties.audio;
              audio.play();
            });
          }
        }
      }).addTo(map);
    });

  // Geolocalización
  map.locate({ setView: true, maxZoom: 14 });

  map.on('locationfound', e => {
    L.circleMarker(e.latlng, {
      radius: 8,
      color: "#007bff",
      fillColor: "#3fa0ff",
      fillOpacity: 0.8
    }).addTo(map);
  });

  map.on('locationerror', () => {
    console.log("No se pudo obtener la ubicación.");
  });
</script>

<!-- Registrar Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
