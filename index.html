<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioguía</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

  <header>
    <h1 id="guide-title">Audio Guide</h1>
    <p id="guide-description" class="subtitle"></p>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- LISTA DE AUDIOS -->
  <ul id="audio-list"></ul>

  <br><br>
  <a href="./EN-ANAGA.pdf" target="_blank">ANAGA - THE PIRATE COAST.PDF</a>

  <!-- Reproductor -->
  <audio id="player" controls></audio>

  <script src="./app.js"></script>

  <!-- MAPA -->
  <script>
  async function initMap() {
    const map = L.map('map').setView([28.53, -16.25], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    const res = await fetch('./ANAGA.geojson');
    const data = await res.json();

    L.geoJSON(data, {
      onEachFeature: (feature, layer) => {
        layer.bindPopup(feature.properties.Name);
      }
    }).addTo(map);
  }

  initMap();
  </script>

</body>
</html>
