<body>

  <header>
    <h1 id="guide-title">Audio Guide</h1>
    <p id="guide-description" class="subtitle"></p>
  </header>


<div id="map" style="width:100%; height:70vh;"></div>

<script>
  function initMap() {
    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 28.414, lng: -16.540 },
      zoom: 13
    });

    // Cargar tu mapa MyMaps como KML
    const kmlLayer = new google.maps.KmlLayer({
      url: "https://www.google.com/maps/d/kml?mid=1xjosQ0axzsEUa-dQOrJ-qTsGGMhvOxQ",
      map: map,
      preserveViewport: false
    });

    // Ubicación del usuario
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        new google.maps.Marker({
          position: { lat: pos.coords.latitude, lng: pos.coords.longitude },
          map,
          title: "Estás aquí",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#4285F4",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#fff"
          }
        });
      });
    }
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCY-SsX3gDUACQUc1aZYlq9kUlgeRD4pWs&callback=initMap" async defer></script>
